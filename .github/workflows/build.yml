name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: swiftc --version
        run: swiftc --version
      - name: make
        run: make
      - name: --help smoke test
        run: ./superbright --help
